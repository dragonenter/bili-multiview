<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>bili-multiview · 多路直播分屏</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a84ff'/%3E%3Cpath d='M7 8h10v8H7zM9 17l3 2 3-2' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header class="toolbar">
        <div class="brand">
            <span class="brand-title">bili-multiview</span>
            <span class="brand-sub">多路直播分屏</span>
        </div>
        <textarea id="urls" placeholder="一行一个 B 站直播链接或房间号（最多 9 路）
https://live.bilibili.com/12345
67890"></textarea>
        <div class="buttons">
            <button id="btn-start">开始观看</button>
            <button id="btn-follow" class="btn-secondary">
                <span class="follow-dot"></span>
                <span>关注 <span id="follow-count">0/0</span></span>
            </button>
            <button id="btn-clear">清空</button>
            <button id="btn-exit-focus" hidden>退出焦点</button>
        </div>
    </header>
    <main id="stage" class="grid empty">
        <div class="empty-hint">
            <div class="logo"></div>
            <h2>同屏看多路 B 站直播</h2>
            <p>把直播链接或房间号粘到上方输入框，每行一个，点 <span class="kbd">开始观看</span>。<br/>单击任一路放大并自动升原画。</p>
            <div class="shortcuts">
                <span><span class="kbd">1</span>–<span class="kbd">9</span> 切焦点</span>
                <span><span class="kbd">←</span><span class="kbd">→</span> 上/下一路</span>
                <span><span class="kbd">F</span> 全屏</span>
                <span><span class="kbd">M</span> 静音</span>
                <span><span class="kbd">Esc</span> 退出</span>
            </div>
        </div>
    </main>

    <!-- 关注列表抽屉 -->
    <aside id="follow-drawer" class="follow-drawer" hidden>
        <div class="follow-header">
            <h3>我的关注</h3>
            <button id="follow-close" class="icon-btn" aria-label="关闭">✕</button>
        </div>
        <div class="follow-summary">
            <span id="follow-summary-text">0 / 0 在播</span>
            <button id="btn-load-live" class="btn-primary-sm" disabled>载入全部在播</button>
        </div>
        <div class="follow-add">
            <input id="follow-input" placeholder="粘贴直播链接或房间号添加…" />
            <button id="btn-follow-add">添加</button>
        </div>
        <div id="follow-list" class="follow-list"></div>
    </aside>
    <div id="follow-overlay" class="follow-overlay" hidden></div>

    <script src="/static/flv.min.js"></script>
    <script src="/static/player.js"></script>
    <script src="/static/follow.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
